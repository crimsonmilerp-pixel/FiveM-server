# ---- Seasonal clothing (Pillar C) ----
# Holiday clothes are hidden in the clothing menu. To show them to everyone for the season, remove the #
# and restart the server. Or paste the line into the txAdmin live console to switch it on right away
# (and the same line with remove_ace instead of add_ace to switch it off).
# add_ace builtin.everyone clothing.festive allow
# add_ace builtin.everyone clothing.halloween allow

